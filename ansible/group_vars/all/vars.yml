---
# Cluster-wide variables. Override per host/group as needed.

# k3s
k3s_install_url: "https://get.k3s.io"
k3s_version: ""              # empty = latest stable. Pin like "v1.31.0+k3s1" once you've chosen one.
k3s_server_args: "--write-kubeconfig-mode 644 --disable traefik"

# Where the kubeconfig from rpi-control should land on your laptop.
kubeconfig_local_path: "{{ lookup('env','HOME') }}/.kube/config-homelab"

# Address that ends up in the kubeconfig + the k3s agent join URL.
# Default = the CP's inventory hostname (e.g. rpi-control.local). Override with an
# IP or a real DNS name if .local mDNS isn't reliable on your network. Examples:
#   cluster_endpoint: 192.168.1.10
#   cluster_endpoint: rpi-control.lan
cluster_endpoint: "{{ hostvars[groups['k3s_server'][0]].ansible_host
                       | default(groups['k3s_server'][0]) }}"

# Rancher
rancher_namespace: cattle-system
rancher_bootstrap_password: "rancher-init-change-me"   # override on the CLI: -e rancher_bootstrap_password=...
rancher_hostname: ""          # empty = auto-compute as rancher.<rpi-control-ip>.nip.io
rancher_chart_version: ""     # empty = latest stable

# Family chat / LLM (see `llm` play in site.yml)
# Open WebUI: API key for the OpenAI-compatible endpoint (OpenRouter, OpenAI,
# Anthropic via proxy, etc.). Empty = playbook applies the manifests but skips
# secret-seeding so you can do it by hand later. Override on CLI:
#   -e llm_api_key='sk-or-v1-...'
llm_api_key: ""

# Ollama: list of model tags to `ollama pull` after the deployment is up.
# Default empty so the playbook doesn't burn 5-10 min per model unprompted.
# Override on CLI: -e '{"ollama_models":["llama3.2:3b"]}'
ollama_models: []

# Tailscale operator: OAuth client credentials from
# https://login.tailscale.com/admin/settings/oauth (Devices+Auth Keys scopes,
# tag:k8s ownership in your ACL). Empty = skip operator install (you can apply
# the Tailscale Ingress later once the operator is up).
tailscale_oauth_client_id: ""
tailscale_oauth_client_secret: ""

# UPS (NUT — Network UPS Tools)
# ubuntu-server owns the USB connection to the CyberPower PR1500LCDRT2U.
# All k3s nodes monitor it as NUT SECONDARY clients.
ups_device_name: cyberpower                           # NUT UPS identifier (used in upsc, upsmon, etc.)
ups_server_host: "{{ hostvars['ubuntu-server'].ansible_host }}"   # 192.168.4.24
ups_upsmon_password: "{{ vault_ups_upsmon_password }}"  # set in group_vars/all/vault.yml
# ntfy bearer token — used by the Pi Zero rack-manager to push UPS events to the phone.
# Add `vault_ntfy_token: tk_ai0qlzxr3o02yctj5kdgpfh01payo` to vault.yml.
ntfy_url: "https://ntfy.bluebuck-micro.ts.net"
ntfy_token: "{{ vault_ntfy_token }}"
