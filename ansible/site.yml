---
# Full provisioning playbook for the rpi k3s homelab.
#
# Usage:
#   ansible-playbook site.yml                       # full run
#   ansible-playbook site.yml --tags prep           # OS prep only
#   ansible-playbook site.yml --tags k3s            # prep + k3s install
#   ansible-playbook site.yml --tags rancher        # Rancher install only
#   ansible-playbook site.yml --limit rpi-node1     # one host only
#
# First-time prerequisites on your laptop:
#   sudo apt install -y ansible
#   ansible-galaxy collection install kubernetes.core community.general
#   ansible -i inventory.ini all -m ping            # smoke test SSH

- name: Base OS prep on every Pi
  hosts: k3s_cluster
  become: true
  gather_facts: true
  tags: [prep, k3s]
  tasks:
    - name: Wait for cloud-init to finish (first-boot only)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Wait for apt/dpkg lock to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false

    - name: apt update + safe upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe
        cache_valid_time: 3600
        lock_timeout: 600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - open-iscsi
          - nfs-common
          - avahi-daemon          # so .local hostnames resolve between Pis
          - libnss-mdns
        state: present
        lock_timeout: 600

    - name: Manage /etc/hosts entries for every cluster node
      # Drops an Ansible-managed block on every Pi that maps rpi-control,
      # rpi-node1, etc. to their LAN IPs. Robust even if mDNS / DNS flake.
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED rpi-cluster"
        block: |
          {% for host in groups['k3s_cluster'] %}
          {{ hostvars[host].ansible_host }} {{ host }} {{ host }}.local
          {% endfor %}

    - name: Enable iscsid (for future Longhorn)
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Disable swap (runtime)
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap (persistent in /etc/fstab)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '#\1'

    - name: Verify memory cgroups are enabled
      ansible.builtin.command: awk '/^memory/ {print $4}' /proc/cgroups
      register: cgroup_check
      changed_when: false

    - name: Fail if memory cgroup is not enabled
      ansible.builtin.assert:
        that: cgroup_check.stdout == '1'
        fail_msg: >-
          memory cgroup not enabled on {{ inventory_hostname }}.
          Add 'cgroup_memory=1 cgroup_enable=memory' to /boot/firmware/cmdline.txt and reboot.

- name: Install k3s server on rpi-control
  hosts: k3s_server
  become: true
  tags: [k3s, k3s-server]
  tasks:
    - name: Check if k3s binary already present
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Run k3s server install
      ansible.builtin.shell: |
        curl -sfL {{ k3s_install_url }} | \
        {% if k3s_version %}INSTALL_K3S_VERSION={{ k3s_version }} {% endif %}sh -s - server {{ k3s_server_args }}
      args:
        executable: /bin/bash
      when: not k3s_bin.stat.exists
      register: k3s_install
      changed_when: k3s_install.rc == 0

    - name: Wait for node-token file
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: Read node-token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_b64

    - name: Stash token as a fact (visible to other plays via hostvars)
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_token_b64.content | b64decode | trim }}"

    - name: Wait for k3s API to report node Ready
      ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: cp_ready
      until: cp_ready.stdout == "True"
      retries: 30
      delay: 5
      changed_when: false

- name: Install k3s agents on all worker Pis
  hosts: k3s_agent
  become: true
  tags: [k3s, k3s-agent]
  tasks:
    - name: Check if k3s already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Run k3s agent install + join
      ansible.builtin.shell: |
        curl -sfL {{ k3s_install_url }} | \
        K3S_URL=https://{{ cluster_endpoint }}:6443 \
        K3S_TOKEN={{ hostvars[groups['k3s_server'][0]].k3s_node_token }} \
        {% if k3s_version %}INSTALL_K3S_VERSION={{ k3s_version }} {% endif %}sh -
      args:
        executable: /bin/bash
      when: not k3s_bin.stat.exists
      register: k3s_join
      changed_when: k3s_join.rc == 0

    # Idempotent reconcile: ensure the agent points at the current control plane
    # and uses the current node token. Recovers from CP IP changes / token
    # rotation / 401 Unauthorized without needing to reinstall k3s.
    - name: Reconcile k3s-agent env (server URL + token)
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-agent.service.env
        owner: root
        group: root
        mode: '0600'
        content: |
          K3S_URL=https://{{ cluster_endpoint }}:6443
          K3S_TOKEN={{ hostvars[groups['k3s_server'][0]].k3s_node_token }}
      notify: restart k3s-agent

  handlers:
    # k3s-agent has a slow, multi-step shutdown — `systemctl restart` often
    # exits non-zero ("did not take the steps required by its unit
    # configuration") even though Restart=always brings the new instance up
    # fine moments later. Tolerate the noisy exit, then poll is-active so
    # we still fail loudly if the service really didn't come back.
    - name: restart k3s-agent
      ansible.builtin.shell: |
        set +e
        systemctl daemon-reload
        systemctl restart k3s-agent
        for i in $(seq 1 12); do
          systemctl is-active --quiet k3s-agent && exit 0
          sleep 5
        done
        echo "k3s-agent did not become active within 60s" >&2
        systemctl status k3s-agent --no-pager -l >&2
        exit 1
      changed_when: true

- name: Fetch kubeconfig to your laptop
  hosts: k3s_server
  become: true
  tags: [kubeconfig]
  tasks:
    - name: Copy /etc/rancher/k3s/k3s.yaml off the Pi
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ kubeconfig_local_path }}"
        flat: true

    - name: Rewrite server URL to reach the Pi from the laptop
      delegate_to: localhost
      become: false
      ansible.builtin.replace:
        path: "{{ kubeconfig_local_path }}"
        regexp: 'server: https://127.0.0.1:6443'
        replace: "server: https://{{ cluster_endpoint }}:6443"

    - name: chmod 600 on kubeconfig
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ kubeconfig_local_path }}"
        mode: '0600'

- name: Install Rancher Manager (ingress-nginx + cert-manager + Rancher)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [rancher]
  vars:
    cp_ip: "{{ hostvars[groups['k3s_server'][0]].ansible_default_ipv4.address }}"
    # Rancher hostname: use the override if set, otherwise auto-pick nip.io of CP IP.
    rancher_host: "{{ rancher_hostname if rancher_hostname else 'rancher.' ~ cp_ip ~ '.nip.io' }}"
  tasks:
    - name: Check helm is on PATH
      ansible.builtin.command: helm version --short
      changed_when: false
      register: helm_check
      failed_when: helm_check.rc != 0

    - name: Add Helm repos
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
      loop:
        - { name: jetstack,       url: "https://charts.jetstack.io" }
        - { name: ingress-nginx,  url: "https://kubernetes.github.io/ingress-nginx" }
        - { name: rancher-stable, url: "https://releases.rancher.com/server-charts/stable" }

    - name: Install ingress-nginx
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: true
        kubeconfig: "{{ kubeconfig_local_path }}"
        wait: true
        timeout: 5m
        values:
          controller:
            service:
              type: LoadBalancer
            publishService:
              enabled: true

    - name: Install cert-manager (with CRDs)
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        release_namespace: cert-manager
        create_namespace: true
        kubeconfig: "{{ kubeconfig_local_path }}"
        wait: true
        timeout: 5m
        values:
          installCRDs: true

    - name: Install Rancher
      kubernetes.core.helm:
        name: rancher
        chart_ref: rancher-stable/rancher
        chart_version: "{{ rancher_chart_version | default(omit, true) }}"
        release_namespace: "{{ rancher_namespace }}"
        create_namespace: true
        kubeconfig: "{{ kubeconfig_local_path }}"
        wait: true
        timeout: 15m
        values:
          hostname: "{{ rancher_host }}"
          bootstrapPassword: "{{ rancher_bootstrap_password }}"
          replicas: 1
          ingress:
            ingressClassName: nginx

    # helm `wait: true` above already blocks on rollout, so this is mostly a
    # sanity check. kubectl rollout status is more robust than k8s_info + until,
    # which can trip on Jinja's strict-undefined when .resources isn't populated.
    - name: Wait for Rancher rollout
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_local_path }}
        -n {{ rancher_namespace }} rollout status deploy/rancher
        --timeout=15m
      changed_when: false

    # Optional: expose Rancher over Tailscale too. Safe to apply even before the
    # Tailscale operator exists — the Ingress just sits Pending until the
    # tailscale ingressClass shows up (installed by the `llm-tailscale` play).
    - name: Apply Tailscale Ingress for Rancher
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_local_path }}"
        state: present
        src: "{{ playbook_dir }}/../manifests/rancher-tailscale.yaml"

    - name: Print access info
      ansible.builtin.debug:
        msg:
          - "Rancher LAN URL:     https://{{ rancher_host }}"
          - "Rancher tailnet URL: https://rancher.bluebuck-micro.ts.net/  (check: kubectl -n cattle-system get ingress rancher-ts)"
          - "Bootstrap password: {{ rancher_bootstrap_password }}"
          - "Accept the self-signed cert (LAN URL only — tailnet URL has real Let's Encrypt TLS)."

- name: Family chat (Open WebUI + Ollama + Tailscale)
  # Usage:
  #   ansible-playbook site.yml --tags llm-webui    -e llm_api_key='sk-or-v1-...'
  #   ansible-playbook site.yml --tags llm-ollama   -e '{"ollama_models":["llama3.2:3b"]}'
  #   ansible-playbook site.yml --tags llm-tailscale \
  #     -e tailscale_oauth_client_id='tskey-client-...' \
  #     -e tailscale_oauth_client_secret='tskey-...'
  #   ansible-playbook site.yml --tags llm           # all three (each step skips if its var is empty)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [llm]
  vars:
    chat_namespace: chat
    ollama_namespace: ollama
    tailscale_namespace: tailscale
    manifests_dir: "{{ playbook_dir }}/../manifests"
  tasks:
    # === Stage 1: Open WebUI ============================================
    - name: Apply Open WebUI manifests
      tags: [llm-webui]
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_local_path }}"
        state: present
        src: "{{ manifests_dir }}/chat-webui.yaml"

    - name: Seed the LLM API key secret
      tags: [llm-webui]
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_local_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: webui-llm-keys
            namespace: "{{ chat_namespace }}"
          type: Opaque
          stringData:
            openai-api-key: "{{ llm_api_key }}"
      no_log: true
      register: webui_secret
      when: llm_api_key | length > 0

    - name: Restart Open WebUI to pick up the new key
      tags: [llm-webui]
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_local_path }}
        -n {{ chat_namespace }} rollout restart deploy/open-webui
      changed_when: true
      when: webui_secret is defined and webui_secret.changed | default(false)

    - name: Wait for Open WebUI rollout
      tags: [llm-webui]
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_local_path }}
        -n {{ chat_namespace }} rollout status deploy/open-webui
        --timeout=10m
      changed_when: false

    # === Stage 2: Ollama (local model fallback) =========================
    - name: Apply Ollama manifests
      tags: [llm-ollama]
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_local_path }}"
        state: present
        src: "{{ manifests_dir }}/ollama.yaml"

    - name: Wait for Ollama rollout
      tags: [llm-ollama]
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_local_path }}
        -n {{ ollama_namespace }} rollout status deploy/ollama
        --timeout=10m
      changed_when: false

    - name: Pull Ollama models (5-10 min per model on Pi)
      tags: [llm-ollama]
      # `ollama pull` is itself idempotent — re-runs are quick "already up to date".
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_local_path }}
        -n {{ ollama_namespace }} exec deploy/ollama --
        ollama pull {{ item }}
      loop: "{{ ollama_models }}"
      changed_when: true

    # === Stage 3: Tailscale operator + tailnet Ingress ==================
    - name: Add Tailscale Helm repo
      tags: [llm-tailscale]
      kubernetes.core.helm_repository:
        name: tailscale
        repo_url: https://pkgs.tailscale.com/helmcharts
      when: tailscale_oauth_client_id | length > 0

    - name: Install Tailscale operator
      tags: [llm-tailscale]
      kubernetes.core.helm:
        name: tailscale-operator
        chart_ref: tailscale/tailscale-operator
        release_namespace: "{{ tailscale_namespace }}"
        create_namespace: true
        kubeconfig: "{{ kubeconfig_local_path }}"
        wait: true
        timeout: 5m
        values:
          oauth:
            clientId: "{{ tailscale_oauth_client_id }}"
            clientSecret: "{{ tailscale_oauth_client_secret }}"
          operatorConfig:
            defaultTags:
              - "tag:k8s"
      no_log: true
      when: tailscale_oauth_client_id | length > 0

    - name: Apply Tailscale Ingress for Open WebUI
      tags: [llm-tailscale]
      # Safe to apply even if the operator isn't installed yet — the Ingress
      # just sits in a Pending state until the tailscale ingressClass appears.
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_local_path }}"
        state: present
        src: "{{ manifests_dir }}/chat-webui-tailscale.yaml"

    - name: Print access info
      tags: [llm-webui, llm-tailscale]
      ansible.builtin.debug:
        msg:
          - "LAN URL:      http://chat.192.168.4.27.nip.io/"
          - "Tailnet URL:  https://chat.bluebuck-micro.ts.net/  (check: kubectl -n chat get ingress open-webui-ts)"
          - "First account you create becomes admin. New signups land in 'pending' until you approve them."
