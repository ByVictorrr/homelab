# Inventory for the rpi k3s homelab.
# Hostnames resolve via Tailscale MagicDNS (tailnet: bluebuck-micro.ts.net).
# LAN IPs are kept as commented fallbacks in case Tailscale is down.

[k3s_server]
rpi-control  ansible_host=rpi-control.bluebuck-micro.ts.net
# rpi-control  ansible_host=192.168.4.27

[k3s_agent]
rpi-node1    ansible_host=rpi-node1.bluebuck-micro.ts.net
# rpi-node1    ansible_host=192.168.4.95
rpi-node2    ansible_host=rpi-node2.bluebuck-micro.ts.net
# rpi-node2    ansible_host=192.168.4.91
rpi-node3    ansible_host=rpi-node3.bluebuck-micro.ts.net
# rpi-node3    ansible_host=192.168.4.94
rpi-node4    ansible_host=rpi-node4.bluebuck-micro.ts.net
# rpi-node4    ansible_host=192.168.4.32

[k3s_cluster:children]
k3s_server
k3s_agent

[k3s_cluster:vars]
ansible_user=victord
ansible_python_interpreter=/usr/bin/python3
