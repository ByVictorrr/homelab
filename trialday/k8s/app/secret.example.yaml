# Example shape only. Generate the real Secret from your .env via
# deploy/scripts/create-secrets.sh (recommended) or:
#
#   kubectl -n trialday create secret generic trialday-env \
#     --from-env-file=.env.production
#
# DATABASE_URL / DIRECT_URL point at the in-cluster Postgres service.
# Keep them in sync with postgres-credentials.
apiVersion: v1
kind: Secret
metadata:
  name: trialday-env
  namespace: trialday
type: Opaque
stringData:
  DATABASE_URL: "postgresql://trialday:REPLACE_ME@postgres.trialday.svc.cluster.local:5432/trialday?schema=public"
  DIRECT_URL: "postgresql://trialday:REPLACE_ME@postgres.trialday.svc.cluster.local:5432/trialday?schema=public"

  NEXT_PUBLIC_APP_URL: "https://trialday.app"

  ANTHROPIC_API_KEY: ""
  CLERK_SECRET_KEY: ""
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
  NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: "/dashboard"
  NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: "/dashboard"

  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PRICE_PRO_MONTHLY: ""
  STRIPE_PRICE_BUSINESS_MONTHLY: ""

  RESEND_API_KEY: ""
  CRON_SECRET: ""

  # Optional
  OPENAI_API_KEY: ""
  NEXT_PUBLIC_POSTHOG_KEY: ""
  NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
  ADMIN_CLERK_IDS: ""
