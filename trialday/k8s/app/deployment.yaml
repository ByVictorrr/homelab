apiVersion: apps/v1
kind: Deployment
metadata:
  name: trialday
  namespace: trialday
  labels:
    app: trialday
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: trialday
  template:
    metadata:
      labels:
        app: trialday
    spec:
      # Spread replicas across nodes so a single Pi rebooting doesn't take the app down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: trialday
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: trialday
          # Tag is patched by deploy/scripts/deploy.sh (or `kubectl set image`).
          image: ghcr.io/byvictorrr/trialday:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: trialday-env
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 4
