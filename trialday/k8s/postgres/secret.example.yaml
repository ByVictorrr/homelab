# Example only — DO NOT commit a real secret. See deploy/scripts/create-secrets.sh
# for a non-interactive way to create the real one from a .env file, or run:
#
#   kubectl -n trialday create secret generic postgres-credentials \
#     --from-literal=POSTGRES_USER=trialday \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=POSTGRES_DB=trialday
#
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: trialday
type: Opaque
stringData:
  POSTGRES_USER: trialday
  POSTGRES_PASSWORD: replace-me
  POSTGRES_DB: trialday
