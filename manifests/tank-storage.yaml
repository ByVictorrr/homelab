---
# Bulk-storage tier — rpi-node4 (192.168.4.32):/mnt/tank (~24 TB usable, growing to ~72 TB).
#
# Backed by TerraMaster D4-320U DAS over USB 3.2 Gen 2. Currently two 26 TB drives:
# one data (/mnt/d1), one parity (/mnt/parity1). SnapRAID computes parity nightly
# (cron on rpi-node4), mergerfs unions data drives into /mnt/tank. Survives any single
# drive failure. See docs/bulk-storage.md.
#
# This is a SECOND NFS tier — the older ~900 GB share on rpi-control (nfs-storage.yaml)
# stays as-is. Apps can migrate to tank one at a time; nothing here disturbs them.
#
# Subdir layout under /mnt/tank:
#   /mnt/tank/family             → Samba "family" share (Macs / iPhones)   → PV tank-family
#   /mnt/tank/photos             → Immich photo library                     → PV tank-photos
#   /mnt/tank/photos/icloud/<s>/ → icloudpd downloads, Immich External Lib  → inline NFS via scripts/add-icloud-account.sh
#   /mnt/tank/media              → future Jellyfin migration                → PV tank-media
#   /mnt/tank/backups            → DB dumps, Longhorn backup target, restic → PV tank-backups
#   /mnt/tank/k8s                → catch-all parent for new app PVs         → PV tank-k8s
#
# All PV capacities are 24Ti because they share one pool — NFS doesn't enforce per-PV
# quotas, so first writer to fill wins. Numbers grow when more drives are added.
#
# Mac / iPhone access:
#   smb://192.168.4.32/family    (user: victord, password set via smbpasswd on the node)
#
# Linux / k8s pod access:
#   nfs://192.168.4.32/mnt/tank
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-tank
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
# tank-root → entire pool, for tools that need a browsable view of everything
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tank-root
spec:
  capacity: { storage: 24Ti }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-tank
  mountOptions: [hard, nfsvers=4.1, rsize=1048576, wsize=1048576]
  nfs:
    server: 192.168.4.32
    path: /mnt/tank
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tank-family
spec:
  capacity: { storage: 24Ti }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-tank
  mountOptions: [hard, nfsvers=4.1, rsize=1048576, wsize=1048576]
  nfs:
    server: 192.168.4.32
    path: /mnt/tank/family
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tank-photos
spec:
  capacity: { storage: 24Ti }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-tank
  mountOptions: [hard, nfsvers=4.1, rsize=1048576, wsize=1048576]
  nfs:
    server: 192.168.4.32
    path: /mnt/tank/photos
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tank-media
spec:
  capacity: { storage: 24Ti }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-tank
  mountOptions: [hard, nfsvers=4.1, rsize=1048576, wsize=1048576]
  nfs:
    server: 192.168.4.32
    path: /mnt/tank/media
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tank-backups
spec:
  capacity: { storage: 24Ti }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-tank
  mountOptions: [hard, nfsvers=4.1, rsize=1048576, wsize=1048576]
  nfs:
    server: 192.168.4.32
    path: /mnt/tank/backups
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tank-k8s
spec:
  capacity: { storage: 24Ti }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-tank
  mountOptions: [hard, nfsvers=4.1, rsize=1048576, wsize=1048576]
  nfs:
    server: 192.168.4.32
    path: /mnt/tank/k8s
