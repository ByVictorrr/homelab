# Expose jellyseerr over Tailscale.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    tailscale.com/hostname: jellyseerr
  name: jellyseerr-ts
  namespace: jellyseerr
spec:
  defaultBackend:
    service:
      name: jellyseerr
      port:
        number: 80
  ingressClassName: tailscale
  tls:
  - hosts:
    - jellyseerr
