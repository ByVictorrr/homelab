---
# Expose Homepage at https://home.bluebuck-micro.ts.net. Bookmark this on every
# family device — it's the single entry point.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ts
  namespace: homepage
  annotations:
    tailscale.com/hostname: "home"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - home
  defaultBackend:
    service:
      name: homepage
      port:
        number: 80
