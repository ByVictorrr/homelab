---
# Ollama — local LLM runner with RTX 3060 GPU acceleration on ubuntu-server.
# Open WebUI auto-discovers models via OLLAMA_BASE_URL (wired in chat-webui.yaml).
#
# RTX 3060 (12 GB VRAM): ~60 tok/s on 8B, ~35 tok/s on 13B. One model lives in
# VRAM at a time; Ollama swaps on demand in ~2s. All models persist on the PVC.
#
# Prereqs:
#   kubectl apply -f manifests/nvidia-device-plugin.yaml
#   # confirm GPU is visible:
#   kubectl get nodes -o json | jq '.items[].status.capacity["nvidia.com/gpu"]'
#
# ── Recommended model set ────────────────────────────────────────────────────
# Pull all after first deploy (takes 10-30 min total depending on connection):
#
#   # General / family — fast, friendly, handles everyday Q&A + photo descriptions
#   kubectl -n ollama exec -it deploy/ollama -- ollama pull llama3.1:8b
#
#   # Vision — image + photo uploads in Open WebUI (drag image into chat)
#   kubectl -n ollama exec -it deploy/ollama -- ollama pull llava:13b
#
#   # Coding (for you) — best local code model; Python, Go, k8s YAML, Ansible
#   kubectl -n ollama exec -it deploy/ollama -- ollama pull qwen2.5-coder:14b
#
# ── Short guide for Open WebUI ───────────────────────────────────────────────
#   Parents / casual use  → pick llama3.1:8b  (fast, never confusing)
#   Photo / image uploads → pick llava:13b    (drag image into the chat box)
#   Coding help           → pick qwen2.5-coder:14b  (or Claude Sonnet via API)
#   Document Q&A          → any model; attach PDF/text via the paperclip icon
#
# Models persist on the PVC across pod restarts — no re-pull needed.
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ollama
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 60Gi   # llama3.1:8b (~5GB) + llava:13b (~8GB) + qwen2.5-coder:14b (~9GB) + headroom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: delaplaine-server
      runtimeClassName: nvidia
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "5m"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "10"
              memory: "16Gi"
              nvidia.com/gpu: "1"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
