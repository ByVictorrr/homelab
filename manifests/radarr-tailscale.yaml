# Expose radarr over Tailscale at https://radarr.bluebuck-micro.ts.net.
# http-redirect: the *arr login redirect is absolute http://, which
# fails on a 443-only ts ingress without it.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    tailscale.com/hostname: radarr
    tailscale.com/http-redirect: 'true'
  name: radarr-ts
  namespace: radarr
spec:
  defaultBackend:
    service:
      name: radarr
      port:
        number: 80
  ingressClassName: tailscale
  tls:
  - hosts:
    - radarr
