---
# Expose Immich on Tailscale at https://photos.bluebuck-micro.ts.net.
# Use this URL in the Immich mobile app so phone backups work off-LAN.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-ts
  namespace: immich
  annotations:
    tailscale.com/hostname: "photos"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - photos
  defaultBackend:
    service:
      name: immich-server
      port:
        number: 2283
