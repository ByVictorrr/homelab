---
# Expose BookWyrm on Tailscale at https://books.bluebuck-micro.ts.net.
# Use this URL on phones — ISBN barcode scanning needs HTTPS (browser
# camera permission is gated on it), and Tailscale gives us a real TLS
# cert without exposing anything to the public internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookwyrm-ts
  namespace: bookwyrm
  annotations:
    tailscale.com/hostname: "books"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - books
  defaultBackend:
    service:
      name: bookwyrm
      port:
        number: 80
