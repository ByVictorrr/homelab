---
# Frigate — NVR with AI object detection.
#
# REQUIRES (in this order of importance):
#   1. RTSP camera(s). Cheap ones: Reolink RLC-510A, Amcrest ASH21-W, Tapo C200.
#   2. A Google Coral USB Accelerator (~$60). Without it, CPU detection on
#      Pi 5 caps at ~5fps for 1 camera and burns a full core. With it: 6+
#      cameras at <10ms inference.
#   3. Storage. Recordings eat ~10GB/camera/day at 1080p; mount NFS-backed
#      PVC if you want >a week of retention.
#
# Add the Coral device to a node, then this manifest pins Frigate to that
# node + mounts /dev/bus/usb so the Coral is visible inside the pod:
#   nodeSelector: { hardware/coral: "true" }
#   ssh victord@rpi-node2 'sudo lsusb | grep -i google'  # confirm visible
#   kubectl label node rpi-node2 hardware/coral=true
#
# Cameras currently configured:
#   - family_guardian: Reolink RLC-510A @ 192.168.4.123 (5MP H.264, no AI accel)
#     Detect on 640x480 substream @ 5fps; record on 2560x1920 mainstream @ 30fps.
#     Password lives in the `frigate-camera-creds` Secret below; rotate there.
---
apiVersion: v1
kind: Namespace
metadata:
  name: frigate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
  namespace: frigate
data:
  config.yml: |
    mqtt:
      enabled: false   # flip to true + point at Home Assistant's mosquitto
    detectors:
      # Once Coral is in: uncomment the edgetpu block and delete cpu.
      cpu:
        type: cpu
      # edgetpu:
      #   type: edgetpu
      #   device: usb
    record:
      enabled: true
      alerts:
        retain:
          days: 7
          mode: motion
      detections:
        retain:
          days: 7
          mode: motion
    snapshots:
      enabled: true
      retain:
        default: 14
    ffmpeg:
      # Pi 5 has hardware H.264 decode via v4l2_m2m, but Frigate's CPU detector
      # works on already-decoded frames so the gain is small for 1 camera at
      # 640x480/5fps. Leave default decoder; revisit if adding more cameras.
      hwaccel_args: []
    cameras:
      family_guardian:
        ffmpeg:
          inputs:
            - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.4.123:554/h264Preview_01_sub
              input_args: preset-rtsp-generic
              roles: [detect]
            - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.4.123:554/h264Preview_01_main
              input_args: preset-rtsp-generic
              roles: [record]
        detect:
          width: 640
          height: 480
          fps: 5
        objects:
          track: [person, car, dog, cat]
---
# Camera RTSP passwords. Referenced from the Deployment's env block and
# substituted into the ConfigMap via Frigate's {FRIGATE_*} env-var syntax.
apiVersion: v1
kind: Secret
metadata:
  name: frigate-camera-creds
  namespace: frigate
type: Opaque
stringData:
  rtsp_password: Sports22
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config-pvc
  namespace: frigate
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: { requests: { storage: 2Gi } }
---
# Recordings live on NFS — big, append-mostly, fine on rpi-control's SSD.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  namespace: frigate
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-1
  volumeName: nfs-frigate
  resources: { requests: { storage: 200Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: frigate }
  template:
    metadata:
      labels: { app: frigate }
    spec:
      # nodeSelector: { hardware/coral: "true" }   # once Coral is attached
      # Avoid rpi-node4: longhorn-engine SIGSEGVs on that node, every PVC
      # scheduled there gets stuck attaching. Remove once rpi-node4 is fixed.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rpi-node4]
      containers:
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate:stable
          securityContext:
            privileged: true     # needed for /dev/bus/usb passthrough (Coral)
          env:
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-camera-creds
                  key: rtsp_password
          ports:
            - { name: web,  containerPort: 5000 }
            - { name: rtsp, containerPort: 8554 }
          volumeMounts:
            - { name: config,    mountPath: /config/config.yml, subPath: config.yml }
            - { name: configpvc, mountPath: /config }
            - { name: media,     mountPath: /media/frigate }
            - { name: dev-bus-usb, mountPath: /dev/bus/usb }
            - { name: shm, mountPath: /dev/shm }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "4",    memory: "2Gi" }
      volumes:
        - { name: config,    configMap: { name: frigate-config } }
        - name: configpvc
          persistentVolumeClaim: { claimName: frigate-config-pvc }
        - name: media
          persistentVolumeClaim: { claimName: frigate-media }
        - { name: dev-bus-usb, hostPath: { path: /dev/bus/usb } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: frigate
  namespace: frigate
spec:
  selector: { app: frigate }
  ports:
    - { port: 80, targetPort: 5000 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frigate
  namespace: frigate
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
    nginx.ingress.kubernetes.io/auth-url: "http://authelia.auth.svc.cluster.local/api/verify"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.192.168.4.27.nip.io"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [frigate.192.168.4.27.nip.io]
      secretName: frigate-tls
  rules:
    - host: frigate.192.168.4.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frigate, port: { number: 80 } }
