---
# Frigate — NVR with AI object detection.
#
# ── CURRENT MODE: CPU (works on any node, no GPU setup needed) ──────────────
# To upgrade to TensorRT (RTX 3060, 100× faster):
#   1. Confirm Ollama is running with GPU (if Ollama works, GPU is ready):
#        kubectl -n ollama get pods   # should show Running
#   2. Flip the THREE blocks marked [CPU] → [GPU] below (image, nodeSelector,
#      detectors). Search for "SWITCH TO TENSORRT" comments.
#   3. kubectl apply -f manifests/frigate.yaml
#
# ── Detector options ─────────────────────────────────────────────────────────
#   cpu        Works now. ~5fps for 1 camera. Runs on any Pi or server.
#   tensorrt   RTX 3060 — ~1ms/frame, 10+ cameras. Needs GPU prereqs below.
#   edgetpu    Google Coral USB (~$60) — 30ms, 6 cameras, any node.
#
# ── GPU prereqs (one-time on delaplaine-server, only needed for TensorRT) ───
#   sudo apt-get install -y nvidia-container-toolkit
#   sudo nvidia-ctk runtime configure --runtime=containerd
#   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
#   sudo systemctl restart k3s-agent  # or k3s if this is the control plane
#   kubectl apply -f manifests/nvidia-device-plugin.yaml
#
# ── Add a camera ─────────────────────────────────────────────────────────────
# Most cameras expose two RTSP streams:
#   sub (detect): low-res 640×480, 5-10fps — USE THIS for detection
#   main (record): full resolution, high fps — for recordings only
#
# Common RTSP URL patterns:
#   Reolink H.264:   rtsp://admin:{PASS}@IP:554/h264Preview_01_sub   (sub)
#                    rtsp://admin:{PASS}@IP:554/h264Preview_01_main  (main)
#   Hikvision:       rtsp://admin:{PASS}@IP:554/Streaming/Channels/102  (sub)
#                    rtsp://admin:{PASS}@IP:554/Streaming/Channels/101  (main)
#   Dahua/Amcrest:   rtsp://admin:{PASS}@IP:554/cam/realmonitor?channel=1&subtype=1
#   Tapo C200/C310:  rtsp://user:{PASS}@IP:554/stream2  (sub)
#                    rtsp://user:{PASS}@IP:554/stream1  (main)
#
# Per-camera passwords: name env vars FRIGATE_<CAMNAME>_PASSWORD, reference
# as {FRIGATE_<CAMNAME>_PASSWORD} in the path. Add to the Secret below.
#
# ── Specialty models (layered on top of base detection) ──────────────────────
#   Face recognition  → Double-Take + CompreFace (deploy: manifests/double-take.yaml TBD)
#   License plates    → fast-plate-ocr sidecar (manifests/lpr.yaml TBD)
#   Custom YOLOv8     → train → yolo export format=engine device=0
#                       → kubectl cp best.engine frigate/<pod>:/config/model_cache/
---
apiVersion: v1
kind: Namespace
metadata:
  name: frigate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
  namespace: frigate
data:
  config.yml: |
    mqtt:
      enabled: false   # flip true + set host: mosquitto.mosquitto.svc.cluster.local

    detectors:
      # [CPU MODE] Works immediately, no GPU setup needed.
      cpu:
        type: cpu
      # ── SWITCH TO TENSORRT: replace the cpu block above with this ────────────
      # tensorrt:
      #   type: tensorrt
      #   device: 0
      # model:
      #   path: /config/model_cache/tensorrt/yolov8n-320.trt
      #   input_tensor: nchw
      #   input_pixel_format: rgb
      #   width: 320
      #   height: 320
      # ──────────────────────────────────────────────────────────────────────────

    ffmpeg:
      hwaccel_args: []
      # ── SWITCH TO TENSORRT: replace hwaccel_args above with this ─────────────
      # hwaccel_args: preset-nvidia-h264   # NVDEC hardware decode
      # ──────────────────────────────────────────────────────────────────────────

    record:
      enabled: true
      alerts:
        retain:
          days: 7
          mode: motion
      detections:
        retain:
          days: 7
          mode: motion
    snapshots:
      enabled: true
      retain:
        default: 14

    cameras:

      # ── Camera 1: Reolink RLC-510A ────────────────────────────────────────────
      family_guardian:
        ffmpeg:
          inputs:
            - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.4.123:554/h264Preview_01_sub
              input_args: preset-rtsp-generic
              roles: [detect]
            - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.4.123:554/h264Preview_01_main
              input_args: preset-rtsp-generic
              roles: [record]
        detect:
          width: 640
          height: 480
          fps: 5
        objects:
          track: [person, car, dog, cat]

      # ── Camera 2 template ─────────────────────────────────────────────────────
      # front_door:
      #   ffmpeg:
      #     inputs:
      #       - path: rtsp://admin:{FRIGATE_FRONT_DOOR_PASSWORD}@192.168.4.124:554/h264Preview_01_sub
      #         input_args: preset-rtsp-generic
      #         roles: [detect]
      #       - path: rtsp://admin:{FRIGATE_FRONT_DOOR_PASSWORD}@192.168.4.124:554/h264Preview_01_main
      #         input_args: preset-rtsp-generic
      #         roles: [record]
      #   detect:
      #     width: 640
      #     height: 480
      #     fps: 10
      #   objects:
      #     track: [person, car, package]
---
apiVersion: v1
kind: Secret
metadata:
  name: frigate-camera-creds
  namespace: frigate
type: Opaque
stringData:
  rtsp_password: Sports22
  # front_door_password: yourpass
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config-pvc
  namespace: frigate
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  namespace: frigate
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-1
  volumeName: nfs-frigate
  resources: { requests: { storage: 200Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: frigate }
  template:
    metadata:
      labels: { app: frigate }
    spec:
      # [CPU MODE] Runs on any node except rpi-node4 (longhorn issues there).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [rpi-node4]
      # ── SWITCH TO TENSORRT: replace affinity above with these two lines ───────
      # nodeSelector:
      #   kubernetes.io/hostname: delaplaine-server
      # runtimeClassName: nvidia
      # ──────────────────────────────────────────────────────────────────────────
      containers:
        - name: frigate
          # [CPU MODE]
          image: ghcr.io/blakeblackshear/frigate:stable
          # ── SWITCH TO TENSORRT: replace image above with this ─────────────────
          # image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
          # ──────────────────────────────────────────────────────────────────────
          securityContext:
            privileged: true
          env:
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-camera-creds
                  key: rtsp_password
            # Uncomment when using TensorRT:
            # - name: NVIDIA_VISIBLE_DEVICES
            #   value: all
            # - name: NVIDIA_DRIVER_CAPABILITIES
            #   value: all
          ports:
            - { name: web,  containerPort: 5000 }
            - { name: rtsp, containerPort: 8554 }
          volumeMounts:
            - { name: config,    mountPath: /config/config.yml, subPath: config.yml }
            - { name: configpvc, mountPath: /config }
            - { name: media,     mountPath: /media/frigate }
            - { name: dev-bus-usb, mountPath: /dev/bus/usb }
            - { name: shm, mountPath: /dev/shm }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "4",    memory: "2Gi" }
            # ── SWITCH TO TENSORRT: replace resources above with this ─────────
            # requests:
            #   cpu: "1"
            #   memory: "2Gi"
            #   nvidia.com/gpu: "1"
            # limits:
            #   cpu: "6"
            #   memory: "8Gi"
            #   nvidia.com/gpu: "1"
            # ──────────────────────────────────────────────────────────────────
      volumes:
        - { name: config,    configMap: { name: frigate-config } }
        - name: configpvc
          persistentVolumeClaim: { claimName: frigate-config-pvc }
        - name: media
          persistentVolumeClaim: { claimName: frigate-media }
        - { name: dev-bus-usb, hostPath: { path: /dev/bus/usb } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: frigate
  namespace: frigate
spec:
  selector: { app: frigate }
  ports:
    - { name: web,  port: 80,   targetPort: 5000 }
    - { name: rtsp, port: 8554, targetPort: 8554 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frigate
  namespace: frigate
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
    nginx.ingress.kubernetes.io/auth-url: "http://authelia.auth.svc.cluster.local/api/verify"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.192.168.4.27.nip.io"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [frigate.192.168.4.27.nip.io]
      secretName: frigate-tls
  rules:
    - host: frigate.192.168.4.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frigate, port: { number: 80 } }
