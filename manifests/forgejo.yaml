---
# Forgejo — self-hosted Git (the community fork of Gitea after Gitea Ltd went
# commercial in 2022). API/UI-compatible with Gitea; arm64-native binary; sqlite
# is fine for one-user homelab. Mirror your GitHub repos here as backup, or
# use it as the primary host. Forgejo Actions are GitHub-Actions-compatible
# (workflows under .forgejo/workflows/ or .github/workflows/).
#
# First-time:
#   kubectl apply -f manifests/forgejo.yaml
#   # Wait for Running, then browse http://git.192.168.4.27.nip.io
#   # First account you create becomes admin.
#
# SSH access (git@git.192.168.4.27.nip.io:user/repo.git):
#   The pod listens on 2222. We expose it via NodePort 30022 on every node.
#   Add to ~/.ssh/config:
#     Host git.lan
#       HostName 192.168.4.27
#       Port 30022
#       User git
#   Then clone:  git clone git.lan:victord/myrepo.git
---
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: forgejo }
  template:
    metadata:
      labels: { app: forgejo }
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:9
          env:
            - { name: USER_UID, value: "1000" }
            - { name: USER_GID, value: "1000" }
            - { name: FORGEJO__server__DOMAIN,     value: git.192.168.4.27.nip.io }
            - { name: FORGEJO__server__ROOT_URL,   value: https://git.192.168.4.27.nip.io/ }
            - { name: FORGEJO__server__SSH_DOMAIN, value: 192.168.4.27 }
            - { name: FORGEJO__server__SSH_PORT,   value: "30022" }
            - { name: FORGEJO__database__DB_TYPE,  value: sqlite3 }
            - { name: FORGEJO__service__DISABLE_REGISTRATION, value: "false" }
          ports:
            - { name: http, containerPort: 3000 }
            - { name: ssh,  containerPort: 2222 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "2",    memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  selector: { app: forgejo }
  ports:
    - { name: http, port: 80, targetPort: 3000 }
---
# SSH on NodePort so `git clone git@<any-node-ip>:user/repo` works.
apiVersion: v1
kind: Service
metadata:
  name: forgejo-ssh
  namespace: forgejo
spec:
  type: NodePort
  selector: { app: forgejo }
  ports:
    - { name: ssh, port: 22, targetPort: 2222, nodePort: 30022 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"  # no upload limit for big repos
    cert-manager.io/cluster-issuer: cluster-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts: [git.192.168.4.27.nip.io]
      secretName: forgejo-tls
  rules:
    - host: git.192.168.4.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: forgejo, port: { number: 80 } }
