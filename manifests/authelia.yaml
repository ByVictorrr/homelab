---
# Authelia — SSO + forward-auth for everything that DOESN'T natively support OIDC,
# and OIDC provider for things that do (Nextcloud, Mealie, Forgejo, Jellyfin
# with plugin, Audiobookshelf 2.7+, Grafana, etc.).
#
# This is a minimal single-user setup using sqlite + file user DB. No Postgres,
# no Redis. Fine for ≤5 users. For more, swap storage to postgres and session
# store to redis.
#
# Setup:
#   1. Edit authelia-users Secret below — replace `argon2$...` hash with one
#      generated by:
#        docker run --rm authelia/authelia:latest authelia crypto hash generate argon2 --password 'yourpassword'
#   2. Generate a fresh JWT secret + session secret (32 random bytes each):
#        openssl rand -hex 32   # one for each
#      Stash them in authelia-secrets below.
#   3. kubectl apply -f manifests/authelia.yaml
#   4. Browse https://auth.192.168.4.27.nip.io and log in.
#
# To protect another app (forward-auth method, easiest), add these annotations
# to its Ingress:
#   nginx.ingress.kubernetes.io/auth-url: "http://authelia.auth.svc.cluster.local/api/verify"
#   nginx.ingress.kubernetes.io/auth-signin: "https://auth.192.168.4.27.nip.io"
# Authelia will challenge unauth'd users; once logged in, the original app sees
# the user via Remote-User / Remote-Groups headers.
---
apiVersion: v1
kind: Namespace
metadata:
  name: auth
---
# Replace argon2 hash via:
#   docker run --rm authelia/authelia authelia crypto hash generate argon2 --password 'your-pass'
apiVersion: v1
kind: Secret
metadata:
  name: authelia-users
  namespace: auth
type: Opaque
stringData:
  users_database.yml: |
    users:
      victord:
        displayname: "Victor"
        password: "$argon2id$v=19$m=65536,t=3,p=4$gEY/R6v9muqD3aY3XvRISA$Qh+Ga4GF5qvo9qHHOorFoAqNtvydTo1qqkVYpzeS2+U"
        email: victord@example.com
        groups:
          - admins
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-secrets
  namespace: auth
type: Opaque
stringData:
  # `openssl rand -hex 32` for each.
  jwt_secret:       08f65bb1d65eae94dcf95546d66b5b78215ffba6f57f2c5eb26ea957194ca126
  session_secret:   6b150710d9b6d75c6f921be3b8e4f22af77cdaa8e640a28ac8b7062326acd580
  storage_encryption_key: bb36e9b54f5a23b50736104d34e0c7bd3afca4dd143bc147ad357827dd4f0320
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: auth
data:
  configuration.yml: |
    theme: dark
    server:
      address: tcp://0.0.0.0:9091
    log: { level: info }
    authentication_backend:
      file:
        path: /config/users_database.yml
        password:
          algorithm: argon2id
    access_control:
      default_policy: deny
      rules:
        - domain: "*.192.168.4.27.nip.io"
          policy: one_factor
        - domain: "*.bluebuck-micro.ts.net"
          policy: one_factor
    session:
      name: authelia_session
      same_site: lax
      expiration: 12h
      inactivity: 1h
      cookies:
        - domain: 192.168.4.27.nip.io
          authelia_url: https://auth.192.168.4.27.nip.io
    storage:
      local:
        path: /data/db.sqlite3
    notifier:
      filesystem:
        filename: /data/notifications.txt
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-data
  namespace: auth
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: auth
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: authelia }
  template:
    metadata:
      labels: { app: authelia }
    spec:
      enableServiceLinks: false
      # Pinned to rpi-node2: that's where the Longhorn replica for the
      # authelia-data PVC lives, AND the longhorn-engine binary on rpi-node4
      # SIGSEGVs on startup (Go nil-pointer in gRPC, affects every PVC
      # scheduled there). Investigate rpi-node4 separately; until then,
      # any stateful workload that lands on it will get stuck attaching.
      nodeSelector:
        kubernetes.io/hostname: rpi-node2
      containers:
        - name: authelia
          image: authelia/authelia:latest
          command: ["authelia"]
          args: ["--config=/config/configuration.yml"]
          env:
            - { name: AUTHELIA_JWT_SECRET_FILE,       value: /secrets/jwt_secret }
            - { name: AUTHELIA_SESSION_SECRET_FILE,   value: /secrets/session_secret }
            - { name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE, value: /secrets/storage_encryption_key }
          ports:
            - { containerPort: 9091 }
          volumeMounts:
            - { name: config,  mountPath: /config/configuration.yml,  subPath: configuration.yml }
            - { name: users,   mountPath: /config/users_database.yml, subPath: users_database.yml }
            - { name: secrets, mountPath: /secrets, readOnly: true }
            - { name: data,    mountPath: /data }
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      volumes:
        - { name: config,  configMap: { name: authelia-config } }
        - { name: users,   secret: { secretName: authelia-users } }
        - { name: secrets, secret: { secretName: authelia-secrets } }
        - name: data
          persistentVolumeClaim:
            claimName: authelia-data
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: auth
spec:
  selector: { app: authelia }
  ports:
    - { port: 80, targetPort: 9091 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  namespace: auth
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts: [auth.192.168.4.27.nip.io]
      secretName: authelia-tls
  rules:
    - host: auth.192.168.4.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: authelia, port: { number: 80 } }
