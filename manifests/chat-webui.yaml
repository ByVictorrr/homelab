---
# Open WebUI — ChatGPT-style frontend backed by local Ollama (RTX 3060) + Claude API.
# Supports image and document uploads in chat (drag-and-drop or paperclip icon).
#
# First-time setup:
#   1. kubectl apply -f manifests/nvidia-device-plugin.yaml
#   2. kubectl apply -f manifests/ollama.yaml
#   3. kubectl apply -f manifests/chat-webui.yaml
#   4. Seed the Anthropic API key (enables Claude models + file/photo uploads):
#        kubectl -n chat create secret generic webui-api-keys \
#          --from-literal=anthropic-api-key="sk-ant-..." \
#          --dry-run=client -o yaml | kubectl apply -f -
#        kubectl -n chat rollout restart deploy/open-webui
#   5. Pull a local vision model for offline use (fits in RTX 3060 12GB VRAM):
#        kubectl -n ollama exec -it deploy/ollama -- ollama pull llava:13b
#   6. Browse to https://chat.bluebuck-micro.ts.net — first account becomes admin.
#
# Photo / file uploads:
#   - Images: any vision model (Claude Sonnet, llava:13b). Drag image into chat.
#   - Documents (PDF, text, code): any model via RAG. Paperclip icon in chat.
#   - Claude Sonnet 4.6 is the best for mixed image+document reasoning.
apiVersion: v1
kind: Namespace
metadata:
  name: chat
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webui-data
  namespace: chat
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: chat
spec:
  replicas: 1
  strategy:
    type: Recreate          # PVC is RWO
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            - name: WEBUI_AUTH
              value: "True"
            # New signups land in "pending" — admin (you) approves them in
            # Settings → Admin → Users before they can chat. Family-safe default.
            - name: DEFAULT_USER_ROLE
              value: "pending"
            - name: ENABLE_SIGNUP
              value: "True"
            # Claude API — enables claude-sonnet-4-6 / claude-opus-4-7 in the model
            # picker with native image + document upload support. Seed the key:
            #   kubectl -n chat create secret generic webui-api-keys \
            #     --from-literal=anthropic-api-key="sk-ant-..." \
            #     --dry-run=client -o yaml | kubectl apply -f -
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: webui-api-keys
                  key: anthropic-api-key
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: chat
spec:
  selector:
    app: open-webui
  ports:
    - port: 80
      targetPort: 8080
---
# LAN ingress (HTTP, nip.io). For remote access, also apply
# `chat-webui-tailscale.yaml` — that gives you https://chat.bluebuck-micro.ts.net
# with automatic TLS, and you can reach it from any device running Tailscale.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: chat
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts: [chat.192.168.4.27.nip.io]
      secretName: open-webui-tls
  rules:
    - host: chat.192.168.4.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 80
