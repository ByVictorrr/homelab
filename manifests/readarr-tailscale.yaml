# Expose readarr over Tailscale.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    tailscale.com/hostname: readarr
  name: readarr-ts
  namespace: readarr
spec:
  defaultBackend:
    service:
      name: readarr
      port:
        number: 80
  ingressClassName: tailscale
  tls:
  - hosts:
    - readarr
