---
# Expose Mealie over Tailscale at https://recipes.bluebuck-micro.ts.net.
# Family can browse + add recipes from anywhere.
# Prereq: Tailscale operator installed (see PROGRESS.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie-ts
  namespace: mealie
  annotations:
    tailscale.com/hostname: "recipes"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - recipes
  defaultBackend:
    service:
      name: mealie
      port:
        number: 80
