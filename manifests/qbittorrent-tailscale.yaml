# Expose qbittorrent over Tailscale.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    tailscale.com/hostname: qbittorrent
  name: qbittorrent-ts
  namespace: qbittorrent
spec:
  defaultBackend:
    service:
      name: qbittorrent
      port:
        number: 80
  ingressClassName: tailscale
  tls:
  - hosts:
    - qbittorrent
