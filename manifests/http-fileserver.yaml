---
# Simple HTTP file server — nginx serving the NFS shared folder with directory
# autoindex enabled. Drop a file into the NFS share (Finder, kubectl cp,
# anywhere), reach it via http://files.192.168.4.27.nip.io/<path>.
#
# Backed by the existing nfs-2-shared PV (rpi-node3:/mnt/nfs/shared).
# Before applying, the subpath must exist + be writable. If you haven't
# already, on rpi-node3 once:
#     sudo mkdir -p /mnt/nfs/shared && sudo chown nobody:nogroup /mnt/nfs/shared
#
# Add new files:
#   - From Mac/PC: mount nfs://192.168.4.94/mnt/nfs and drop files in `shared/`
#   - From cluster: any pod with a `nfs-2` storageClass PVC at this share
#   - From terminal: ssh victord@192.168.4.94 'sudo cp my-file /mnt/nfs/shared/'
apiVersion: v1
kind: Namespace
metadata:
  name: http-fileserver
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files
  namespace: http-fileserver
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-1
  volumeName: nfs-root              # rpi-control:/mnt/nfs (whole share — see manifests/nfs-storage.yaml)
  resources:
    requests:
      storage: 900Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: http-fileserver
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /srv/files;
      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime on;
      charset utf-8;
      client_max_body_size 0;
      location / {
        # Allow large downloads to stream
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: http-fileserver
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - { name: conf,  mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: files, mountPath: /srv/files }
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "500m", memory: "128Mi" }
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
            items:
              - { key: default.conf, path: default.conf }
        - name: files
          persistentVolumeClaim:
            claimName: files
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: http-fileserver
spec:
  selector: { app: nginx }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: http-fileserver
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    cert-manager.io/cluster-issuer: cluster-ca
    nginx.ingress.kubernetes.io/auth-url: "http://authelia.auth.svc.cluster.local/api/verify"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.192.168.4.27.nip.io"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [files.192.168.4.27.nip.io]
      secretName: http-fileserver-tls
  rules:
    - host: files.192.168.4.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ts
  namespace: http-fileserver
  annotations:
    tailscale.com/hostname: "files"
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [files]
  defaultBackend:
    service:
      name: nginx
      port:
        number: 80
