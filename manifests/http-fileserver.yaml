---
# Simple HTTP file server — nginx serving the bulk-storage NFS pool with
# directory autoindex enabled. Drop a file anywhere in /mnt/tank on rpi-node4
# (Finder via SMB, kubectl cp, NFS mount), reach it via:
#   - https://files.<tailnet>.ts.net/ (Tailscale, see Ingress at bottom)
#   - http://files.192.168.4.27.nip.io/<path> (LAN)
#
# Backed by tank-root (rpi-node4:/mnt/tank, ~24 TB, growing to ~72 TB).
# Was previously bound to nfs-root (rpi-control:/mnt/nfs, 900 GB) — migrated
# to the bigger tier on 2026-06-25.
#
# Add new files:
#   - From Mac/iPhone: smb://192.168.4.32/family → /mnt/tank/family/
#   - From cluster: any pod with a `nfs-tank` PVC pointed at tank-root or a subdir
#   - From terminal: ssh victord@192.168.4.32 'sudo cp my-file /mnt/tank/family/'
apiVersion: v1
kind: Namespace
metadata:
  name: http-fileserver
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files
  namespace: http-fileserver
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-tank
  volumeName: tank-root             # rpi-node4:/mnt/tank (whole pool — see manifests/tank-storage.yaml)
  resources:
    requests:
      storage: 24Ti
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: http-fileserver
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /srv/files;
      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime on;
      charset utf-8;
      client_max_body_size 0;
      location / {
        # Allow large downloads to stream
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: http-fileserver
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - { name: conf,  mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: files, mountPath: /srv/files }
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "500m", memory: "128Mi" }
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
            items:
              - { key: default.conf, path: default.conf }
        - name: files
          persistentVolumeClaim:
            claimName: files
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: http-fileserver
spec:
  selector: { app: nginx }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: http-fileserver
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    cert-manager.io/cluster-issuer: cluster-ca
    nginx.ingress.kubernetes.io/auth-url: "http://authelia.auth.svc.cluster.local/api/verify"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.192.168.4.27.nip.io"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [files.192.168.4.27.nip.io]
      secretName: http-fileserver-tls
  rules:
    - host: files.192.168.4.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ts
  namespace: http-fileserver
  annotations:
    tailscale.com/hostname: "files"
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [files]
  defaultBackend:
    service:
      name: nginx
      port:
        number: 80
