---
# claude-worker — autonomous Claude Code "work day" on the cluster.
#
# Ten CronJobs per workday (Mon-Fri). Three "realism" sessions on the
# simulation pipeline (morning/midday/evening) plus seven "acquisition
# readiness" sessions, each focused on a specific theme that makes TrialDay
# look like a must-buy to an HR-tech acquirer (Workday, Greenhouse,
# SAP SuccessFactors, etc):
#
#   12:00 UTC  claude-acq-architecture   acquirer-friendly architecture
#   13:00 UTC  claude-morning            simulation realism
#   14:00 UTC  claude-acq-bias           fairness/bias story (AEDT, EU AI Act)
#   15:00 UTC  claude-acq-data-moat      role library + benchmark database
#   16:00 UTC  claude-acq-trust          trust/security/procurement signals
#   17:00 UTC  claude-midday             simulation realism
#   18:00 UTC  claude-acq-integrations   ATS integration breadth + public API
#   19:00 UTC  claude-acq-outcomes       case studies + ROI proof
#   20:00 UTC  claude-acq-expansion      internal mobility / L&D adjacency
#   21:00 UTC  claude-evening            simulation realism + EOD handoff
#
# Each spin up a pod that:
#   1. Installs `@anthropic-ai/claude-code` from npm (~30s on a Pi)
#   2. Clones ByVictorrr/trialday via SSH (was: worksim, renamed)
#   3. Checks out (or creates) branch `auto/main` — a single rolling branch
#      so each session continues where the prior one left off, day to day.
#   4. Reads WORKLOG.md to see where the previous session left off
#   5. Runs `claude -p` with the timeslot-specific prompt (one of the ten)
#   6. Commits + pushes any changes Claude made
#
# Then at 6pm ET, `manifests/trialday-builder.yaml` rebuilds the cluster
# trialday pod from the tip of auto/main, so https://trialday.bluebuck-micro.ts.net
# shows the day's work next morning.
#
# Each run also publishes its raw log + the day's WORKLOG.md to
# https://files.bluebuck-micro.ts.net/shared/claude-worker/  (autoindex from nginx
# http-fileserver) and regenerates an index.html dashboard there.
#
# Focused on the JD → job simulation feature of TrialDay. Never touches the
# real `main` branch — auto/main is the workspace; you merge auto/main → main
# yourself when ready to ship to Vercel prod.
#
# ============================================================================
# ONE-TIME SETUP — populate the two Secrets out-of-band (don't commit real keys)
# ============================================================================
#
# 1) Anthropic API key:
#      kubectl -n claude-worker create secret generic anthropic-api \
#        --from-literal=api-key='sk-ant-...' \
#        --dry-run=client -o yaml | kubectl apply -f -
#
# 2) GitHub SSH deploy key (RW) for ByVictorrr/worksim:
#      ssh-keygen -t ed25519 -f /tmp/claude-worker -N '' -C 'claude-worker@cluster'
#      # Add /tmp/claude-worker.pub to GitHub → worksim repo → Settings → Deploy keys
#      #   ✓ Allow write access
#      ssh-keyscan github.com > /tmp/known_hosts
#      kubectl -n claude-worker create secret generic git-ssh \
#        --from-file=id_ed25519=/tmp/claude-worker \
#        --from-file=known_hosts=/tmp/known_hosts \
#        --dry-run=client -o yaml | kubectl apply -f -
#      rm /tmp/claude-worker /tmp/claude-worker.pub /tmp/known_hosts
#
# 3) Apply:
#      kubectl apply -f manifests/claude-worker.yaml
#
# ============================================================================
# WATCHING IT WORK
# ============================================================================
#
#   kubectl -n claude-worker get cronjobs
#   kubectl -n claude-worker get jobs
#   kubectl -n claude-worker logs -l app=claude-worker --tail=200
#
#   # Trigger one manually (e.g. test the morning prompt right now):
#   kubectl -n claude-worker create job --from=cronjob/claude-morning manual-$(date +%s)
#
# To pause one: `kubectl -n claude-worker patch cronjob claude-morning -p '{"spec":{"suspend":true}}'`
# To pause all acquisition jobs:
#   for n in architecture bias data-moat trust integrations outcomes expansion; do
#     kubectl -n claude-worker patch cronjob claude-acq-$n -p '{"spec":{"suspend":true}}'
#   done
# Same with `false` to resume.
#
# Cron times are UTC. Currently EDT (UTC-4), so the wall-clock layout is:
#   12:00 UTC = 8am  ET   architecture
#   13:00 UTC = 9am  ET   morning  (realism)
#   14:00 UTC = 10am ET   bias
#   15:00 UTC = 11am ET   data-moat
#   16:00 UTC = 12pm ET   trust
#   17:00 UTC = 1pm  ET   midday   (realism)
#   18:00 UTC = 2pm  ET   integrations
#   19:00 UTC = 3pm  ET   outcomes
#   20:00 UTC = 4pm  ET   expansion
#   21:00 UTC = 5pm  ET   evening  (realism + EOD handoff)
# The 22:00 UTC slot is intentionally left to the trialday-builder rebuild.
# When EST kicks in (Nov-Mar) these slide an hour earlier in local time. Adjust
# the cron expressions if you care; the workday-emulation point is unchanged.
apiVersion: v1
kind: Namespace
metadata:
  name: claude-worker
---
# NOTE: The `anthropic-api` and `git-ssh` Secrets are intentionally NOT in this
# manifest. They're created out-of-band (see header) so that re-applying this
# file (to update prompts, schedules, etc.) never clobbers your real keys.
# The CronJobs below reference them by name; pods will FailedScheduling if
# they're missing.
---
# Prompts, the runner script, and shared config. Editing this ConfigMap +
# `kubectl rollout` is the fast iteration path — no image rebuild needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-worker-config
  namespace: claude-worker
data:
  GIT_REPO_URL: "git@github.com:ByVictorrr/worksim.git"
  GIT_USER_NAME: "claude-worker"
  GIT_USER_EMAIL: "claude-worker@bluebuck-micro.ts.net"
  CLAUDE_MODEL: "claude-sonnet-4-6"
  CLAUDE_MAX_TURNS: "30"

  run.sh: |
    #!/usr/bin/env bash
    # Entrypoint: clone, prep branch, run claude, push.
    set -euo pipefail

    TIMESLOT="${TIMESLOT:?must be morning|midday|evening}"
    DATE="$(date -u +%Y-%m-%d)"
    TIME="$(date -u +%H%MZ)"
    # Single rolling branch so each session continues yesterday's work.
    # The end-of-day trialday builder rebuilds from the tip of this branch.
    BRANCH="auto/main"
    WORKDIR="${HOME}/work"
    OUTDIR="/output/claude-worker/${DATE}"
    LOG_FILE="/tmp/run-${TIMESLOT}.log"

    # Tee all output to a log file so we can publish it to the HTTP fileserver
    # at the end of the run. `kubectl logs` still works in parallel.
    exec > >(tee -a "$LOG_FILE") 2>&1

    # Ensure we publish the log no matter how we exit (success, failure, timeout).
    publish_log() {
      mkdir -p "$OUTDIR" 2>/dev/null || true
      cp "$LOG_FILE" "${OUTDIR}/${TIMESLOT}-${TIME}.log" 2>/dev/null || true
      # Also copy the day's WORKLOG.md if claude ran far enough to clone the repo.
      [ -f "${WORKDIR}/WORKLOG.md" ] && cp "${WORKDIR}/WORKLOG.md" "${OUTDIR}/WORKLOG.md" 2>/dev/null || true
      chmod -R a+r "${OUTDIR}" 2>/dev/null || true
    }

    # Regenerate index.html dashboard from the file tree under /output/claude-worker.
    generate_dashboard() {
      local root="/output/claude-worker"
      cd "$root" 2>/dev/null || return 0
      {
        echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>claude-worker</title>'
        echo '<style>body{font-family:-apple-system,system-ui,sans-serif;max-width:920px;margin:40px auto;padding:0 20px;color:#222;line-height:1.5}'
        echo 'h1{border-bottom:2px solid #eee;padding-bottom:10px}h2{margin-top:32px;color:#555;font-size:18px}'
        echo 'ul{list-style:none;padding-left:0}li{padding:6px 0;border-bottom:1px solid #f0f0f0}'
        echo 'a{color:#0366d6;text-decoration:none}a:hover{text-decoration:underline}'
        echo '.timeslot{display:inline-block;width:80px;font-weight:600;color:#666}.meta{color:#999;font-size:12px}</style></head><body>'
        echo '<h1>claude-worker &mdash; autonomous iteration log</h1>'
        echo '<p><a href="https://github.com/ByVictorrr/trialday/tree/auto/main">&rarr; auto/main branch on GitHub</a> | '
        echo '<a href="https://trialday.bluebuck-micro.ts.net">&rarr; cluster trialday</a></p>'
        for date_dir in $(ls -d 20*/ 2>/dev/null | sort -r); do
          d=${date_dir%/}
          echo "<h2>$d</h2><ul>"
          for log in $(ls "${date_dir}"*.log 2>/dev/null | sort); do
            slot=$(basename "$log" .log)
            timeslot_name="${slot%%-*}"
            echo "<li><span class=\"timeslot\">${timeslot_name}</span><a href=\"${date_dir}$(basename "$log")\">${slot}.log</a></li>"
          done
          if [ -f "${date_dir}WORKLOG.md" ]; then
            echo "<li><span class=\"timeslot\">worklog</span><a href=\"${date_dir}WORKLOG.md\">WORKLOG.md (end-of-session)</a></li>"
          fi
          echo "</ul>"
        done
        echo '<p class="meta">Generated by claude-worker. Each run regenerates this page.</p>'
        echo '</body></html>'
      } > index.html.tmp 2>/dev/null && mv index.html.tmp index.html 2>/dev/null || true
      chmod a+r index.html 2>/dev/null || true
    }

    trap 'publish_log; generate_dashboard' EXIT

    echo "==> [$(date -u +%H:%M:%SZ)] timeslot=${TIMESLOT} branch=${BRANCH}"
    echo "==> log will publish to: https://files.bluebuck-micro.ts.net/shared/claude-worker/${DATE}/${TIMESLOT}-${TIME}.log"

    # --- Install git + ssh client (node:22-slim has neither) -------------
    if ! command -v git >/dev/null 2>&1; then
      echo "==> apt install git openssh-client"
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends git openssh-client ca-certificates
    fi

    # --- SSH setup from mounted secret -----------------------------------
    mkdir -p "${HOME}/.ssh"
    chmod 700 "${HOME}/.ssh"
    install -m 600 /secrets/git-ssh/id_ed25519 "${HOME}/.ssh/id_ed25519"
    # Fresh keyscan at runtime — more reliable than the pre-baked known_hosts
    # in the secret (which can be empty/malformed if the laptop's ssh-keyscan
    # was misconfigured at secret-creation time).
    ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "${HOME}/.ssh/known_hosts" 2>/dev/null

    git config --global user.name  "${GIT_USER_NAME}"
    git config --global user.email "${GIT_USER_EMAIL}"

    # --- Install claude code --------------------------------------------
    echo "==> installing @anthropic-ai/claude-code"
    npm install -g --silent @anthropic-ai/claude-code

    # --- Clone + branch --------------------------------------------------
    rm -rf "${WORKDIR}"
    # Try the rolling branch first. If it doesn't exist (first ever run),
    # clone main and create it.
    if git clone --depth 30 --branch "${BRANCH}" "${GIT_REPO_URL}" "${WORKDIR}" 2>/dev/null; then
      echo "==> resumed existing branch ${BRANCH}"
    else
      echo "==> branch ${BRANCH} doesn't exist yet — cloning main and creating it"
      git clone --depth 30 "${GIT_REPO_URL}" "${WORKDIR}"
      cd "${WORKDIR}" && git checkout -B "${BRANCH}" && cd -
    fi
    cd "${WORKDIR}"

    # Ensure WORKLOG exists so the prompt can read it on day 1.
    [ -f WORKLOG.md ] || cat > WORKLOG.md <<'EOF'
    # Auto Worklog

    Fresh start. No prior context.
    EOF

    # --- Run claude ------------------------------------------------------
    # No --max-turns: the 1h activeDeadlineSeconds is the real cap, and 30 turns
    # was getting eaten by codebase exploration before any edits landed.
    PROMPT_FILE="/prompts/${TIMESLOT}.md"
    echo "==> running claude (model=${CLAUDE_MODEL})"
    claude \
      --print \
      --dangerously-skip-permissions \
      --model "${CLAUDE_MODEL}" \
      < "${PROMPT_FILE}" \
      || echo "==> claude exited non-zero (continuing to push anything it managed to commit)"

    # --- Push whatever ended up committed --------------------------------
    if git diff --quiet "origin/${BRANCH}" 2>/dev/null; then
      echo "==> no new commits to push"
    else
      echo "==> pushing ${BRANCH}"
      git push --set-upstream origin "${BRANCH}"
    fi

    echo "==> done"

  morning.md: |
    It is the start of the work day (~9am Monday-Friday). You are the only
    engineer on shift; you have until the next session (~1pm) to make
    forward progress.

    Focus area: the **JD → job simulation** pipeline of TrialDay (this repo,
    ByVictorrr/worksim). Relevant entry points include the white-collar JD
    classifier, role routing, and the simulation generation flow.

    **Realism gap to chip away at:** the current sim generators lean heavily
    on Jira / Kanban-board mechanics (ticket assigned → in-progress → review
    → done) for every role. That fits PM / SWE-style roles but reads as fake
    for roles whose real day isn't ticket-driven — e.g. sales, marketing,
    finance/accounting, ops, legal, recruiting, support, exec. When the
    morning's pick is open-ended, audit the role-routing output: find a role
    where the generated day still defaults to a Jira/Kanban scaffold and
    replace it with the artifacts that role actually uses (CRM pipeline,
    campaign brief, close-the-books checklist, contract redlines, candidate
    pipeline, ticket queue with SLAs, board deck, etc.). Pick ONE role per
    session — don't try to refactor the whole router.

    Process:

    1. Read `WORKLOG.md`. If it has unfinished work from a prior session,
       resume that — do not start something new.
    2. Otherwise, pick **one** concrete, scoped improvement from `ROADMAP.md`,
       `todo.md`, recent commit messages, or open TODOs in the JD/sim code.
       Prefer something you can finish (or meaningfully advance) in one
       session.
    3. Write a short plan at the top of `WORKLOG.md`: what you're doing, why,
       and the success criterion. Keep prior entries below.
    4. Implement. Run the relevant tests (`npm test` or a narrower vitest run
       if faster) before you commit. If tests fail, fix them before
       committing — never commit a red build.
    5. Commit in small logical chunks with conventional-commit messages
       (`feat(sim): ...`, `fix(jd): ...`, `test: ...`). You are on branch
       `auto/main` — never push to the real `main`.
    6. Update `WORKLOG.md` with what's done and what's left, then commit
       that too.

    Rules:
    - Do NOT touch `.env`, `.env.local`, Stripe/Clerk/Supabase keys, or any
      secret-shaped file.
    - Do NOT modify CI workflows under `.github/` unless the task explicitly
      requires it.
    - Do NOT run `git push` yourself — the runner pushes after you exit.
    - If a task turns out to be larger than one session, leave a clear
      handoff note in `WORKLOG.md` and commit what works.

  midday.md: |
    It is midday (~1pm). The morning session has already run. You're
    continuing the same workday on branch `auto/main`.

    Process:

    1. Read `WORKLOG.md` to see what the morning session planned and what
       state it left things in.
    2. If tests are broken, fix them first. A red build is the top priority.
    3. Continue the morning's task. If it's already finished and committed,
       pick the next item from the morning's plan (or the next obvious
       improvement in the JD → simulation area). If you're picking fresh,
       prefer continuing the realism push: find another role whose simulated
       day still defaults to Jira/Kanban scaffolding and replace it with the
       artifacts that role actually uses (CRM pipeline, campaign brief,
       close-the-books checklist, contract redlines, candidate pipeline,
       support queue with SLAs, board deck, etc.). One role per session.
    4. Same commit hygiene as the morning: small commits, conventional
       messages, tests green before committing.
    5. Update `WORKLOG.md` with progress + what's left for the evening
       session.

    Same rules as morning: no `.env` edits, no `.github/` edits unless asked,
    no `git push` (the runner does it).

  evening.md: |
    It is end-of-day (~5pm). This is the last session of the workday on
    branch `auto/main`. The cluster `trialday` builder will rebuild the
    `https://trialday.bluebuck-micro.ts.net` pod from the tip of this branch
    starting at 6pm — so whatever you push must build, test, and deploy
    cleanly.

    Your job is to **leave a clean handoff** — not start anything ambitious.

    Process:

    1. Read `WORKLOG.md` and `git status`.
    2. If there's uncommitted work that's nearly done, finish a small slice
       that's committable. If it's not finishable in a few turns, revert it
       (`git restore`) and leave a clear TODO comment + worklog note instead
       of committing broken code.
    3. Run the full relevant test suite. Make sure the tip of the branch is
       green. If you broke something earlier in the day that's still red,
       fix it now or revert the offending commit.
    4. Write a clear handoff section at the top of `WORKLOG.md`:
       - **What got done today** (one or two bullets)
       - **What's next** (the concrete task the morning session should pick
         up)
       - **Blockers / open questions** (if any)
    5. Commit the worklog. That's it. Do not start a new feature.

    Same rules: no `.env` edits, no `.github/` edits, no `git push`.

  # ==========================================================================
  # ACQUISITION-READINESS PROMPTS
  # --------------------------------------------------------------------------
  # Each of the seven prompts below is owned by ONE focused theme that an
  # HR-tech acquirer (Workday / Greenhouse / SAP SuccessFactors / iCIMS) will
  # weigh during diligence. Unlike the morning/midday/evening triad, these do
  # NOT share a common task list — each prompt operates in its own scope of
  # the codebase, so they can run on the same `auto/main` branch without
  # stepping on each other.
  #
  # State coordination is by `git log --oneline` rather than WORKLOG.md: each
  # prompt instructs the model to grep the recent commit history for its
  # own conventional-commit prefix and continue where prior sessions left off.
  # ==========================================================================

  bias.md: |
    Acquisition-readiness session: **fairness & bias** story.

    Why this matters: HR-tech acquirers do diligence on EEOC compliance,
    NYC AEDT Local Law 144, and EU AI Act readiness. A credible bias story
    is gating — buyers will not absorb a candidate-scoring product without
    one.

    Scope (only touch these surfaces):
    - `src/app/company/bias/**` — adverse impact dashboard for hiring teams
    - `src/app/legal/fairness/**` — public fairness/validation methodology
    - `src/app/api/bias-audit/**` — bias audit report endpoint
    - `src/lib/fairness/**` — disparate impact, four-fifths rule, name-blind
    - Score/report code that needs a fairness hook

    Backlog (pick ONE per session; ship it; stop):
    1. Company-side adverse impact dashboard — pass rates by self-reported
       demographic with four-fifths rule flagging in red
    2. Public `/legal/fairness` page describing validation methodology
       (placeholder numbers are fine — the *narrative* is the deliverable)
    3. `/api/bias-audit/[companyId]` endpoint that renders the NYC AEDT
       bias audit report shape (print-CSS HTML is enough, no PDF lib)
    4. Name-blind evaluation mode — mask candidate name + photo from the
       AI evaluator and from reviewers until a decision is recorded
    5. Calibrated rater agreement page — inter-rater reliability narrative
    6. Demographic voluntary self-id opt-in flow

    Process:
    1. `git log --oneline -30 | grep -iE 'fairness|bias|audit'` — see what
       prior sessions in this theme already shipped; do not duplicate.
    2. Pick ONE backlog item. If a previous session started one and didn't
       finish, continue that.
    3. Implement on branch `auto/main`. Small commits with conventional
       prefixes: `feat(fairness):` / `feat(bias):` / `feat(audit):` /
       `test(fairness):`.
    4. Run `npm test` (or a narrower vitest) before each commit. Never
       commit a red build.

    Rules: no `.env` edits, no `.github/` edits, no `git push` (the runner
    does it).

  data-moat.md: |
    Acquisition-readiness session: **proprietary data moat** — the role
    content library and the benchmark database.

    Why this matters: Workday can build features. They acquire for content
    and data they can't rebuild. "8 roles" looks small; "200+ validated
    simulations across 14 industries, benchmarked against 50,000 sessions"
    looks like an asset. Even partial progress towards those numbers,
    surfaced in the product, materially changes the diligence narrative.

    Scope:
    - `src/lib/roles/**` and `prisma/seed*.ts` — role library expansion
    - `src/app/dashboard/benchmarks/**` — benchmark browsing UI
    - `src/app/api/benchmarks/**` — benchmark query endpoints
    - `src/lib/taxonomy/**` — skills taxonomy mapped to O*NET / Lightcast
    - Marketing pages that surface the catalog count

    Backlog (pick ONE per session):
    1. Add one new role with a complete simulation config (JD, scenario,
       teammates, scoring rubric, hidden challenge). Look at existing roles
       for the shape.
    2. Industry + level filters on the benchmark browser (e.g. "Senior
       SWE at Series B"). Filter the query, then expose in the UI.
    3. Skills taxonomy mapping: add `src/lib/taxonomy/onet.ts` with a
       minimal O*NET code lookup; tag at least 3 roles with their codes.
    4. Catalog count badge on the landing/pricing page driven by an actual
       DB count, not a hardcoded number — so the number grows automatically.
    5. Public `/catalog` page listing available role simulations with
       SEO-friendly URLs.
    6. Benchmark percentile API for embedding into a third-party (the
       endpoint shape future ATSes would integrate against).

    Process:
    1. `git log --oneline -30 | grep -iE 'role|taxonomy|benchmark|catalog'`
    2. Pick ONE. Ship a small slice. Conventional commits:
       `feat(roles):` / `feat(taxonomy):` / `feat(benchmark):` /
       `feat(catalog):`.
    3. `npm test` green before each commit. Never red.

    Rules: no `.env`, no `.github/`, no `git push`.

  trust.md: |
    Acquisition-readiness session: **trust & enterprise procurement
    signals**. The shape of the trust page, the security narrative, and
    the procurement-facing artifacts a buyer's IT/legal team will demand.

    Why this matters: enterprise buyers (and acquirers' integration teams)
    will not even start a POC without a recognizable trust posture. Most of
    this work is signaling — having the page, the artifact, the
    sub-processors list — long before the underlying audit is real. "SOC 2
    Type II in progress" beats no mention at all by orders of magnitude.

    Scope:
    - `src/app/trust/**` — public trust hub
    - `src/app/security/**` — security posture page
    - `src/app/legal/dpa/**`, `src/app/legal/sub-processors/**`,
      `src/app/legal/msa/**`
    - `src/app/status/**` — static status page stub (or external link)
    - Footer links from existing pages into the trust hub

    Backlog (pick ONE per session):
    1. `/trust` hub page — SOC 2 / GDPR / CCPA badges (mark in-progress
       honestly), links to security, DPA, sub-processors, status
    2. `/security` page — encryption at rest/in transit, access controls,
       backup posture, incident response, pen test cadence
    3. `/legal/sub-processors` — table of vendors (Anthropic, Supabase,
       Clerk, Vercel/k3s, Stripe, ...) with purpose + region
    4. `/legal/dpa` and `/legal/msa` downloadable / printable shells
    5. `/status` stub — link out to a real status page (status.trialday.app)
       or an inline static "All systems operational" placeholder
    6. Footer revamp on every public page to expose the trust hub link

    Process:
    1. `git log --oneline -30 | grep -iE 'trust|security|dpa|sub-proc|msa|status'`
    2. Pick ONE. Conventional commits: `feat(trust):` / `feat(security):` /
       `feat(legal):`.
    3. `npm test` green before each commit.

    Rules: no `.env`, no `.github/`, no `git push`.

  integrations.md: |
    Acquisition-readiness session: **integration depth** — the marketplace
    surface and the public API.

    Why this matters: one webhook is a feature. A logo grid of supported
    ATSes plus a documented public API is a *platform*. Acquirers map your
    integration footprint to their own ecosystem and the gap they'd inherit.

    Scope:
    - `src/app/integrations/**` — public integrations hub + per-vendor pages
    - `src/app/api/v1/**` — versioned public API surface
    - `src/app/docs/**` — developer docs (API reference, webhooks)
    - `src/lib/integrations/**` — vendor adapters (Greenhouse, Lever, etc)
    - `src/app/company/integrations/**` — in-app integration management

    Backlog (pick ONE per session):
    1. Integrations hub `/integrations` with a logo grid: Workday,
       Greenhouse, Lever, iCIMS, Ashby, SAP SuccessFactors, BambooHR —
       each linking to its own /integrations/[slug] detail page (the
       detail pages can be stubs marked "Available / Coming soon")
    2. Public API surface at `/api/v1/sessions` (read) — token-auth'd,
       returns the public-safe shape of a SimSession
    3. Developer docs at `/docs/api` — endpoint reference, auth, rate limits
    4. Greenhouse adapter shell in `src/lib/integrations/greenhouse.ts`
       beyond the generic webhook (typed payloads, signature verification)
    5. Lever adapter shell in `src/lib/integrations/lever.ts`
    6. In-app `/company/integrations` management page — per-vendor enable
       toggles, credential storage shape (no real OAuth needed yet)
    7. OpenAPI spec stub at `/api/openapi.json` describing the public API

    Process:
    1. `git log --oneline -30 | grep -iE 'integration|api/v1|greenhouse|lever|workday|openapi'`
    2. Pick ONE. Conventional commits: `feat(integrations):` /
       `feat(api):` / `feat(docs):`.
    3. `npm test` green before each commit.

    Rules: no `.env`, no `.github/`, no `git push`.

  outcomes.md: |
    Acquisition-readiness session: **outcomes proof** — case studies, ROI
    calculator, and the logo wall.

    Why this matters: every acquirer asks "what do customers actually get?"
    Even pilot-quality testimonials with one quantifiable number each
    ("47% faster time-to-hire") move the conversation from feature
    comparison to value capture. Stage-appropriate, not fabricated — but
    *present* beats absent.

    Scope:
    - `src/app/customers/**` — public case studies (one page per logo)
    - `src/app/roi/**` — ROI calculator
    - `src/components/marketing/LogoWall.tsx` and any landing-page surface
    - `src/app/pricing/**` — where ROI typically gets surfaced

    Backlog (pick ONE per session):
    1. Case study template page `src/app/customers/[slug]/page.tsx` with
       a clean layout (challenge / solution / outcome / quote / metric)
    2. First case study at `/customers/example-co` with placeholder
       company name + realistic-looking numbers (clearly flagged as
       illustrative until a real customer signs off)
    3. Second case study with a different role-type focus
    4. `/roi` calculator — inputs: open reqs, avg time-to-hire,
       cost-per-hire; outputs: projected savings; tie into pricing
    5. Reusable `<LogoWall>` component dropped on landing + pricing
    6. "Featured in" press strip — even just publication logos with
       "as covered in" framing (only use logos you can legitimately cite)

    Process:
    1. `git log --oneline -30 | grep -iE 'customer|roi|case-stud|logo|press'`
    2. Pick ONE. Conventional commits: `feat(customers):` / `feat(roi):` /
       `feat(marketing):`.
    3. `npm test` green before each commit.

    IMPORTANT: do NOT invent real customer names, logos, or quotes. Use
    obviously-illustrative placeholders ("Acme Co", "Example Inc") and
    add a small "illustrative example" note until real customers approve.

    Rules: no `.env`, no `.github/`, no `git push`.

  expansion.md: |
    Acquisition-readiness session: **adjacent expansion** — re-position
    TrialDay from "another assessment tool" to "the workforce simulation
    platform" by extending into internal mobility and L&D.

    Why this matters: Workday's strategic interest is workforce planning,
    internal mobility, succession planning, and L&D — not just
    pre-hire assessment. A product that *also* serves existing employees
    is a much bigger acquisition narrative (and a much bigger TAM slide)
    than one that only serves hiring.

    Scope:
    - `src/app/internal/**` — internal mobility flows (employees taking
      sims to explore lateral moves)
    - `src/app/onboarding/**` — post-hire simulation flow for new hires
    - `src/app/ld/**` — learning & development framing
    - `src/lib/sim/modes.ts` — simulation "mode" abstraction
      (`hiring` | `internal-mobility` | `onboarding` | `ld`)
    - Marketing pages that explain the use cases

    Backlog (pick ONE per session):
    1. Add a `mode` discriminator to SimSession (default `hiring`) and
       thread it through the existing scoring/report code without
       changing behavior. Foundation for everything else here.
    2. `/internal` landing page — explain the internal mobility use case
       to enterprise buyers
    3. `/onboarding` landing page — post-hire ramp via simulated week-1
       scenarios
    4. `/ld` landing page — upskilling framing with the existing role
       library as the curriculum
    5. Internal-mobility flow in `/sim` that uses a different report
       template (focus on fit + growth areas, not pass/fail)
    6. "Mode" selector in company settings — which use cases this org
       has enabled

    Process:
    1. `git log --oneline -30 | grep -iE 'internal|onboarding|mobility|ld|mode'`
    2. Pick ONE. If item 1 (mode discriminator) hasn't shipped yet, do
       that first — the others depend on it.
    3. Conventional commits: `feat(internal):` / `feat(onboarding):` /
       `feat(ld):` / `feat(sim):` for the mode plumbing.
    4. `npm test` green before each commit.

    Rules: no `.env`, no `.github/`, no `git push`.

  architecture.md: |
    Acquisition-readiness session: **acquirer-friendly architecture** —
    the technical talking points an acquirer's integration team will
    grep the codebase for during diligence.

    Why this matters: at the corp-dev → engineering handoff, an
    acquirer's tech-lead opens the repo and looks for: multi-tenant
    isolation, vendor abstraction (so they're not locked into Anthropic),
    auditable event streams (so they can pipe data into their warehouse),
    and clean module boundaries. Bonus points for typed contracts and a
    plug-in shape for the simulation engine.

    Scope:
    - `src/lib/ai/**` — AI provider abstraction (currently Anthropic-only)
    - `src/lib/events/**` — activity log as an event stream + export
    - `src/lib/tenancy/**` — explicit tenant-isolation helpers
    - `src/app/api/v1/events/**` — event-stream export endpoint
    - Docs in `docs/architecture/**` (create if absent) — diagrams +
      ADRs (architectural decision records)

    Backlog (pick ONE per session):
    1. AI provider interface in `src/lib/ai/provider.ts` — an `LLMProvider`
       interface; refactor one Anthropic call site to go through it.
       Don't rip out Anthropic; just prove the abstraction works.
    2. Event-stream shape in `src/lib/events/types.ts` — typed event
       union for everything currently going into the activity log
    3. `/api/v1/events?since=...` endpoint that streams (JSONL) the
       event log for a given company — the shape an acquirer would
       wire into Snowflake/BigQuery
    4. Tenant-isolation audit helper `src/lib/tenancy/scope.ts` —
       wraps Prisma queries to require an explicit companyId scope
    5. `docs/architecture/overview.md` — one-page architecture summary
       with a Mermaid diagram (multi-tenant, plugin registry, AI layer)
    6. First ADR at `docs/architecture/adr/0001-plugin-registry.md`
       explaining why the role/tool registry pattern was chosen
    7. Plugin manifest schema for the tool registry — typed JSON shape
       so third-party tools could in principle ship as packages

    Process:
    1. `git log --oneline -30 | grep -iE 'ai/provider|events|tenancy|adr|architecture|plugin'`
    2. Pick ONE. Refactors must be behavior-preserving — no functional
       changes, tests stay green.
    3. Conventional commits: `refactor(ai):` / `feat(events):` /
       `feat(tenancy):` / `docs(architecture):`.
    4. `npm test` green before each commit.

    Rules: no `.env`, no `.github/`, no `git push`.
---
# Shared CronJob template. Each timeslot is a thin wrapper that sets TIMESLOT
# and the schedule. apiVersion/kind below.
# (YAML anchors don't survive across separated documents in kubectl, so we
# repeat the spec — keep the three in sync.)

# 9am ET (13:00 UTC during EDT) — Monday-Friday
apiVersion: batch/v1
kind: CronJob
metadata:
  name: claude-morning
  namespace: claude-worker
spec:
  schedule: "0 13 * * 1-5"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600   # hard kill at 1h
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app: claude-worker, timeslot: morning }
        spec:
          restartPolicy: Never
          containers:
            - name: claude
              image: node:22-slim
              command: ["/bin/bash", "/scripts/run.sh"]
              env:
                - { name: TIMESLOT,    value: "morning" }
                - { name: HOME,        value: "/root" }
                - { name: IS_SANDBOX,  value: "1" }
                - name: ANTHROPIC_API_KEY
                  valueFrom: { secretKeyRef: { name: anthropic-api, key: api-key } }
                - name: GIT_REPO_URL
                  valueFrom: { configMapKeyRef: { name: claude-worker-config, key: GIT_REPO_URL } }
                - name: GIT_USER_NAME
                  valueFrom: { configMapKeyRef: { name: claude-worker-config, key: GIT_USER_NAME } }
                - name: GIT_USER_EMAIL
                  valueFrom: { configMapKeyRef: { name: claude-worker-config, key: GIT_USER_EMAIL } }
                - name: CLAUDE_MODEL
                  valueFrom: { configMapKeyRef: { name: claude-worker-config, key: CLAUDE_MODEL } }
                - name: CLAUDE_MAX_TURNS
                  valueFrom: { configMapKeyRef: { name: claude-worker-config, key: CLAUDE_MAX_TURNS } }
              volumeMounts:
                - { name: scripts,  mountPath: /scripts,  readOnly: true }
                - { name: prompts,  mountPath: /prompts,  readOnly: true }
                - { name: git-ssh,  mountPath: /secrets/git-ssh, readOnly: true }
                - { name: home,     mountPath: /root }
                - { name: output,   mountPath: /output }
              resources:
                requests: { cpu: "500m", memory: "1Gi" }
                limits:   { cpu: "2",    memory: "2Gi" }
          volumes:
            - name: scripts
              configMap:
                name: claude-worker-config
                items: [{ key: run.sh, path: run.sh, mode: 0755 }]
            - name: prompts
              configMap:
                name: claude-worker-config
                items:
                  - { key: morning.md,      path: morning.md      }
                  - { key: midday.md,       path: midday.md       }
                  - { key: evening.md,      path: evening.md      }
                  - { key: bias.md,         path: bias.md         }
                  - { key: data-moat.md,    path: data-moat.md    }
                  - { key: trust.md,        path: trust.md        }
                  - { key: integrations.md, path: integrations.md }
                  - { key: outcomes.md,     path: outcomes.md     }
                  - { key: expansion.md,    path: expansion.md    }
                  - { key: architecture.md, path: architecture.md }
            - name: git-ssh
              secret:
                secretName: git-ssh
                defaultMode: 0600
            - name: home
              emptyDir: {}
            - name: output
              nfs:
                server: 192.168.4.27
                path: /mnt/nfs/shared
---
