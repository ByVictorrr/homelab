# Expose prowlarr over Tailscale at https://prowlarr.bluebuck-micro.ts.net.
# http-redirect: the *arr login redirect is absolute http://, which
# fails on a 443-only ts ingress without it.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    tailscale.com/hostname: prowlarr
    tailscale.com/http-redirect: 'true'
  name: prowlarr-ts
  namespace: prowlarr
spec:
  defaultBackend:
    service:
      name: prowlarr
      port:
        number: 80
  ingressClassName: tailscale
  tls:
  - hosts:
    - prowlarr
