---
# Cluster-local Docker registry. Lets us push images built on the laptop
# and have all 4 Pis pull from a single source. Exposed via Tailscale so
# pushes from the laptop and pulls from each Pi both go through the tailnet
# (HTTPS by Let's Encrypt, no insecure-registry config needed).
#
# Push from laptop:
#   docker tag <image>:<tag> registry.bluebuck-micro.ts.net/<image>:<tag>
#   docker push registry.bluebuck-micro.ts.net/<image>:<tag>
#
# Use in a Deployment:
#   spec.template.spec.containers[0].image: registry.bluebuck-micro.ts.net/<image>:<tag>
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: LoadBalancer
  selector: { app: registry }
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-ts
  namespace: registry
  annotations:
    tailscale.com/hostname: "registry"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - registry
  defaultBackend:
    service:
      name: registry
      port:
        number: 5000
