# Expose lidarr over Tailscale at https://lidarr.bluebuck-micro.ts.net.
# http-redirect: the *arr login redirect is absolute http://, which
# fails on a 443-only ts ingress without it.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    tailscale.com/hostname: lidarr
    tailscale.com/http-redirect: 'true'
  name: lidarr-ts
  namespace: lidarr
spec:
  defaultBackend:
    service:
      name: lidarr
      port:
        number: 80
  ingressClassName: tailscale
  tls:
  - hosts:
    - lidarr
