# Prowlarr. Exported from the live cluster 2026-10-20.
---
apiVersion: v1
kind: Namespace
metadata:
  name: prowlarr
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vault-prowlarr-config
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 5Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: prowlarr
    name: prowlarr-config
  nfs:
    path: /mnt/tank/appdata/prowlarr
    server: 192.168.4.50
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-vault
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: prowlarr
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-vault
  volumeName: vault-prowlarr-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - rpi-node4
      containers:
      - env:
        - name: TZ
          value: America/Los_Angeles
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        image: lscr.io/linuxserver/prowlarr:latest
        imagePullPolicy: Always
        name: prowlarr
        ports:
        - containerPort: 9696
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /config
          name: config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: prowlarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 9696
  - name: prowlarr
    port: 9696
    protocol: TCP
    targetPort: 9696
  selector:
    app: prowlarr
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
  name: prowlarr
  namespace: prowlarr
spec:
  ingressClassName: nginx
  rules:
  - host: prowlarr.192.168.4.27.nip.io
    http:
      paths:
      - backend:
          service:
            name: prowlarr
            port:
              number: 80
        path: /
        pathType: Prefix
  - host: prowlarr.bluebuck-micro.ts.net
    http:
      paths:
      - backend:
          service:
            name: prowlarr
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - prowlarr.192.168.4.27.nip.io
    - prowlarr.bluebuck-micro.ts.net
    secretName: prowlarr-tls
