# Expose bazarr over Tailscale.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    tailscale.com/hostname: bazarr
  name: bazarr-ts
  namespace: bazarr
spec:
  defaultBackend:
    service:
      name: bazarr
      port:
        number: 80
  ingressClassName: tailscale
  tls:
  - hosts:
    - bazarr
