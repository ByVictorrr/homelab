    # not used — Kubernetes mode
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      initContainers:
        # Seed a writable /app/config from the read-only ConfigMap + the image's
        # skeleton (custom.css / custom.js etc). Needed because homepage v0.x+
        # writes to /app/config at startup, but ConfigMap volumes are read-only.
        - name: init-config
          image: ghcr.io/gethomepage/homepage:latest
          command: ["sh", "-c"]
          args:
            - |
              set -e
              cp -L /tmp/config-ro/*.yaml /app/config/
              for f in /app/src/skeleton/*; do
                name=$(basename "$f")
                [ -e "/app/config/$name" ] || cp -L "$f" "/app/config/$name"
              done
              ls -la /app/config
          volumeMounts:
            - { name: config-ro, mountPath: /tmp/config-ro }
            - { name: config,    mountPath: /app/config }
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "home.192.168.4.27.nip.io,home.bluebuck-micro.ts.net"
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: logs
              mountPath: /app/config/logs
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: config-ro
          configMap:
            name: homepage-config
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector:
    app: homepage
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
    nginx.ingress.kubernetes.io/auth-url: "http://authelia.auth.svc.cluster.local/api/verify"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.192.168.4.27.nip.io"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [home.192.168.4.27.nip.io]
      secretName: homepage-tls
  rules:
    - host: home.192.168.4.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 80
