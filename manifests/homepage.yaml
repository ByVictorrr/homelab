---
# Homepage — a single landing page for the whole homelab. Lists every app
# with a clickable card, status, and optional widget (CPU/mem/etc).
# Configured via YAML in /app/config, mounted from a ConfigMap below so the
# config is editable via `kubectl edit configmap`.
#
# First-time setup:
#   1. kubectl a → the dashboard you'll bookmark on every device.
#   3. Edit the apps list:
#        kubectl -n homepage edit configmap homepage-config
#      Add/remove app cards in services.yaml. Pod auto-reloads.
#
# Tip: bookmark this URL on every family phone / laptop. One link → all apps.
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
# RBAC: lets Homepage read pod/service status from the cluster
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes, services]
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: v1
kind: ConfigMap
